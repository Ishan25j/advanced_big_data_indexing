version: "3.9"

services:
  redis:
    image: redis:latest
    container_name: redis_server
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "advanced_data_indexing"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch_server
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false       # disable auth for local dev
      - ES_JAVA_OPTS=-Xms1g -Xmx1g         # 1 GB heap
    ports:
      - "9200:9200"                        # REST API
      - "9300:9300"                        # internal transport
    volumes:
      - es_data:/usr/share/elasticsearch/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_server
    ports:
      - "5672:5672"                        # AMQP
      - "15672:15672"                      # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana_server
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"                        # Kibana UI

volumes:
  redis_data:
  es_data:
  rabbitmq_data: